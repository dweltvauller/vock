# vock.cfg

[general]
# Set your default language.
# Options: arpabet, english, spanish, russian, german, italian, french, hungarian, polish, portuguese, czech
language = arpabet

# Root folder that all paths below are resolved against. Defaults to "./"
# (this folder). Point it at another project's folder to run the pipeline
# against that project.
project_root = ../vock-fo2/

# Source-tree layout the project uses. Flip this alongside project_root.
#   flat  (default) -- category folders: msg/, acm/, lip/, txt/, scripts/, art/, loc/
#   data            -- an RPU-shaped data/ tree, sparse (only the files this mod
#                      changes). Source MSGs are read from data/text/<lang>/**/*.msg
#                      and the DAT is packed from data/** verbatim. Generated
#                      speech (acm/lip/txt) is written into data/sound/speech/<folder>/;
#                      wav/ and textgrid/ stay top-level as rebuild metadata.
# vock-fo2 flips to "data" as part of its tree migration; the other projects
# (phil, monty-python, darion, frank, vorpalrat, vock-fo1) stay on "flat".
layout = data

[paths]
# --- flat layout ---------------------------------------------------------------
# Category folders, relative to project_root. Ignored when layout = data
# (except wav, textgrid, the *_filter / *_dat / snd2acm / mfa_lock entries,
# which are used in both layouts).
msg         = ./msg
txt         = ./txt
acm         = ./acm
lip         = ./lip
loc         = ./loc
scripts     = ./scripts
art         = ./art

# --- data layout -------------------------------------------------------------
# Root of the RPU-shaped tree. Used only when layout = data.
data_root   = ./data

# --- both layouts ----------------------------------------------------------
audio       = ./audio
wav         = ./wav
textgrid    = ./textgrid
dat         = ./dat/vock.dat
float_dat   = ./dat/vock_floats.dat
combat_dat  = ./dat/vock_combat.dat
snd2acm     = ./snd2acm.exe
npc_filter    = ./npc_filter.cfg
float_filter  = ./float_filter.cfg
combat_filter = ./combat_filter.cfg
mfa_lock      = ./mfa_lock.cfg

# RPU repo path (relative to this vock.cfg's own folder, NOT project_root --
# the RPU repo is a sibling of vock/ itself, shared across whichever project
# project_root points at). Used by tools/msg_localize.py.
rpu_text        = ../rpu/data/text

[acm_only]
# Source-MSG basenames whose tagged lines are ACM-only: no MFA, no LIP, and the
# generated audio goes to sound/speech/<basename>/ (not a per-NPC folder).
# For pipboy.msg this is the FISSION holodisk-narration path -- one continuous
# recording per holodisk, so forced alignment does not apply.
# Per-NPC combat barks are NOT listed here; they use combat_filter.cfg and land
# in each NPC's own speech folder, exactly like floats.
msgs = pipboy

[settings]
mfa_env = aligner   # Set the MFA environment
lufs    = -16.0     # Set the LUFS for audio normalization
no_norm = false     # Normalization enabled
